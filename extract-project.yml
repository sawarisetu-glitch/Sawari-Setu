name: Extract Sawari Setu Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -name "*.zip" -type f | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          rm -rf SawariSetuAndroid
          mkdir -p SawariSetuAndroid
          cp -a "$PROJECT_DIR"/. SawariSetuAndroid/

      - name: Save project to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add SawariSetuAndroid
          git commit -m "Save extracted Sawari Setu Android project" || echo "Nothing to commit"
          git push

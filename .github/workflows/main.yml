name: Build सवारी सेतु Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force AndroidX configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Checking gradle.properties..."

          if [ -f gradle.properties ]; then
            echo "gradle.properties found:"
            cat gradle.properties
          else
            echo "gradle.properties not found. Creating it..."
          fi

          touch gradle.properties

          sed -i '/^[[:space:]]*android\.useAndroidX[[:space:]]*=/d' gradle.properties
          sed -i '/^[[:space:]]*android\.enableJetifier[[:space:]]*=/d' gradle.properties

          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties

          echo "Final AndroidX configuration:"
          cat gradle.properties

      - name: Get SHA-1
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Getting Android signing SHA-1..."
          gradle :app:signingReport --no-daemon

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          export ORG_GRADLE_PROJECT_android_useAndroidX=true
          export ORG_GRADLE_PROJECT_android_enableJetifier=true

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawari-setu-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle & Build APK
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gradle
        
        # प्रोजेक्ट डायरेक्टरी ढूंढना
        PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
        cd "$PROJECT_DIR"
        
        # अगर gradlew न हो तो नया wrapper तैयार करना
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SawariSetu-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"

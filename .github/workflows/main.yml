name: Build सवारी सेतु Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android project
        run: |
          echo "Android project files:"
          ls -la "Sawari Setu Android"
          echo ""
          echo "App files:"
          ls -la "Sawari Setu Android/app"

      - name: Build APK
        run: |
          cd "Sawari Setu Android"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawari-setu-debug-apk
          path: 'Sawari Setu Android/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

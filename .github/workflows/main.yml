name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find gradlew and Build APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: gradlew file not found anywhere!"
          exit 1
        fi
        DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew in: $DIR"
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SawariSetu-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"

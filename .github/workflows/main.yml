name: Build Sawari Setu APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Sawari Setu project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Save Android project to GitHub
        run: |
          rm -rf SawariSetuAndroid
          mkdir -p SawariSetuAndroid
          cp -a "$PROJECT_DIR"/. SawariSetuAndroid/

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add SawariSetuAndroid
          git diff --cached --quiet || git commit -m "Save Sawari Setu Android project"
          git push
      - name: Get SHA- 1
        run: |
          gradle -p "$PROJECT_DIR" signingReport --no-daemon | grep -A 8 "Variant: debug"
      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          find "$PROJECT_DIR" -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawari-setu-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Sawari Setu APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          if [ -f "SawariSetuAndroid/settings.gradle" ] || [ -f "SawariSetuAndroid/settings.gradle.kts" ]; then
            PROJECT_DIR="SawariSetuAndroid"
          else
            PROJECT_DIR=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create debug keystore and get SHA-1
        run: |
          mkdir -p ~/.config/.android

          keytool -genkeypair \
            -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "===== SHA-1 CERTIFICATE ====="

          keytool -list -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey | grep "SHA1:"

          echo "============================="

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          find "$PROJECT_DIR" -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawari-setu-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

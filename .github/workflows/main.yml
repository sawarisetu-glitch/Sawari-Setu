name: Build सवारी सेतु Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          cd "$PROJECT_DIR"
          echo "Android project contents:"
          ls -la

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "Enabling AndroidX..."
          export ORG_GRADLE_PROJECT_android_useAndroidX=true
          export ORG_GRADLE_PROJECT_android_enableJetifier=true

          echo "Starting APK build..."
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawari-setu-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

name: Build सवारी सेतु application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Check project files
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Searching for Gradle wrapper..."
          find . -name "gradlew" -type f -print

      - name: Give Gradle Permission
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found"
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          echo "Building APK using: $GRADLEW"
          "$GRADLEW" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

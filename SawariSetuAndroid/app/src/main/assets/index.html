<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>सवारी सेतु - Sawari Setu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#00AA4F;
  --primary-dark:#00853D;
  --primary-light:#E8F8EE;
  --dark:#111827;
  --gray:#6B7280;
  --light-gray:#F3F4F6;
  --card-bg:#FFFFFF;
  --shadow:0 12px 32px rgba(0,0,0,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#F9FAFB;
  color:var(--dark);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* HEADER BAR */
.top-nav{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  padding:10px 16px;
  border-radius:24px;
  box-shadow:0 8px 24px rgba(0,0,0,0.07);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
}

.brand h1{
  font-size:18px;
  font-weight:800;
  color:var(--dark);
  letter-spacing:-0.3px;
}

.brand h1 span{
  color:var(--primary);
}

.badge-live{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--primary-light);
  color:var(--primary-dark);
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:12px;
}

.badge-live::before{
  content:'';
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 0 2px rgba(0,170,79,0.3);
}

/* FULLSCREEN MAP */
#mapContainer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

#map{
  width:100%;
  height:100%;
}

.map-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#E5E7EB;
  color:var(--gray);
  font-weight:600;
  z-index:2;
}

#map.loaded + .map-placeholder{display:none;}

/* BOTTOM SHEET CONTAINER */
.sheet{
  position:absolute;
  bottom:64px;
  left:0;
  right:0;
  max-width:540px;
  margin:auto;
  background:var(--card-bg);
  border-radius:28px 28px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,0.12);
  z-index:50;
  max-height:76vh;
  overflow-y:auto;
  padding:16px 20px 24px;
  transition:transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.drag-handle{
  width:42px;
  height:5px;
  background:#D1D5DB;
  border-radius:10px;
  margin:0 auto 14px;
}

/* OLA-STYLE ROUTE INPUTS */
.route-box{
  background:var(--light-gray);
  border-radius:18px;
  padding:12px 14px;
  position:relative;
  margin-bottom:14px;
}

.dots-indicator{
  position:absolute;
  left:22px;
  top:26px;
  bottom:26px;
  width:2px;
  background:#D1D5DB;
  z-index:2;
}

.dots-indicator::before{
  content:'';
  position:absolute;
  top:-2px;
  left:-4px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--primary);
  border:2px solid #fff;
}

.dots-indicator::after{
  content:'';
  position:absolute;
  bottom:-2px;
  left:-4px;
  width:10px;
  height:10px;
  background:var(--dark);
  border:2px solid #fff;
}

.input-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding-left:26px;
  position:relative;
}

.input-row:first-child{
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:1px solid #E5E7EB;
}

.input-row input{
  width:100%;
  border:0;
  background:transparent;
  font-size:15px;
  font-weight:600;
  color:var(--dark);
  font-family:inherit;
  outline:none;
}

.input-row input::placeholder{
  color:#9CA3AF;
  font-weight:500;
}

.gps-action{
  position:absolute;
  right:0;
  background:none;
  border:0;
  font-size:18px;
  cursor:pointer;
}

/* AUTOCOMPLETE SUGGESTIONS */
.suggestions-box{
  position:absolute;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border-radius:16px;
  box-shadow:0 12px 36px rgba(0,0,0,0.18);
  margin-top:6px;
  z-index:9999;
  max-height:220px;
  overflow-y:auto;
}

.sugg-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid #F3F4F6;
  cursor:pointer;
}

.sugg-item:hover, .sugg-item:active{
  background:var(--primary-light);
}

.sugg-item b{
  font-size:14px;
  color:var(--dark);
  display:block;
}

.sugg-item small{
  color:var(--gray);
  font-size:12px;
  display:block;
}

/* RIDE TYPE CHIPS */
.pill-group{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.pill{
  flex:1;
  border:1px solid #E5E7EB;
  background:#fff;
  border-radius:12px;
  padding:9px;
  font-size:13px;
  font-weight:700;
  color:var(--gray);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.pill.active{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

/* VEHICLE CARDS (UBER STYLE) */
.vehicles{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  overflow-x:auto;
  padding-bottom:4px;
}

.vehicle-card{
  flex:0 0 115px;
  border:2px solid #E5E7EB;
  border-radius:18px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  background:#fff;
}

.vehicle-card.active{
  border-color:var(--primary);
  background:var(--primary-light);
}

.vehicle-card .emoji{
  font-size:26px;
  margin-bottom:4px;
  display:block;
}

.vehicle-card .name{
  font-size:13px;
  font-weight:700;
  color:var(--dark);
  margin-bottom:2px;
}

.vehicle-card .price{
  font-size:15px;
  font-weight:800;
  color:var(--primary-dark);
}

.vehicle-card .eta{
  font-size:11px;
  color:var(--gray);
}

/* PASSENGER & MOBILE */
.details-row{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}

.details-row .field{
  flex:1;
  background:var(--light-gray);
  border-radius:14px;
  padding:10px 12px;
}

.details-row label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--gray);
  margin-bottom:2px;
  text-transform:uppercase;
}

.details-row input{
  width:100%;
  border:0;
  background:transparent;
  font-size:14px;
  font-weight:700;
  color:var(--dark);
  outline:none;
}

/* CTA BUTTON */
.btn-book{
  width:100%;
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:18px;
  padding:15px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,170,79,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-book:active{
  transform:scale(0.98);
}

/* BOTTOM NAVIGATION */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:64px;
  background:#fff;
  border-top:1px solid #E5E7EB;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:90;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:#9CA3AF;
  border:0;
  background:none;
  cursor:pointer;
  gap:3px;
}

.nav-item.active{
  color:var(--primary);
}

.nav-item .icon{
  font-size:18px;
}

/* DRIVER & ADMIN PAGES OVERLAY */
.overlay-page{
  position:fixed;
  inset:0;
  bottom:64px;
  background:#F9FAFB;
  z-index:70;
  padding:20px;
  overflow-y:auto;
  display:none;
}

.overlay-page.active{
  display:block;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}

.stat-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
}

.stat-card span{
  font-size:12px;
  color:var(--gray);
  font-weight:600;
}

.stat-card b{
  display:block;
  font-size:22px;
  font-weight:800;
  color:var(--dark);
  margin-top:4px;
}

.status-badge{
  padding:8px 12px;
  border-radius:10px;
  background:#E0F2FE;
  color:#0369A1;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}
</style>
</head>

<body>

<!-- TOP FLOATING HEADER -->
<div class="top-nav">
  <div class="brand">
    <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3063/3063823.png'">
    <h1>सवारी <span>सेतु</span></h1>
  </div>
  <div class="badge-live">प्रयागराज रीजन</div>
</div>

<!-- FULLSCREEN MAP -->
<div id="mapContainer">
  <div id="map"></div>
  <div id="mapPlaceholder" class="map-placeholder">Google Maps लोड हो रहा है...</div>
</div>

<!-- CUSTOMER BOTTOM SHEET (OLA/UBER STYLE) -->
<div id="customerSheet" class="sheet">
  <div class="drag-handle"></div>

  <!-- ROUTE SEARCH BOX -->
  <div class="route-box">
    <div class="dots-indicator"></div>

    <div class="input-row">
      <input id="pickup" value="सिरसा, प्रयागराज" oninput="onSearchInput('pickup')" placeholder="पिकअप लोकेशन">
      <button class="gps-action" onclick="useCurrentLocation()" title="मेरी लोकेशन">📍</button>
      <div id="pickupSuggestions" class="suggestions-box"></div>
    </div>

    <div class="input-row">
      <input id="destination" placeholder="कहाँ जाना है? (जैसे: कर्मा, वीरपुर, ऊंचडीह...)" oninput="onSearchInput('destination')">
      <div id="destinationSuggestions" class="suggestions-box"></div>
    </div>
  </div>

  <!-- RIDE TYPE -->
  <div class="pill-group">
    <button id="pillShare" class="pill active" onclick="setRideType('Share')">👥 शेयर राइड (सस्ती)</button>
    <button id="pillDirect" class="pill" onclick="setRideType('Direct')">⚡ डायरेक्ट (पर्सनल)</button>
  </div>

  <!-- VEHICLE SELECTOR -->
  <div class="vehicles">
    <div class="vehicle-card active" onclick="selectVehicle('e-rickshaw',this)">
      <span class="emoji">🛺</span>
      <div class="name">ई-रिक्शा</div>
      <div class="price" id="price-e-rickshaw">₹0</div>
      <div class="eta">3 मिनट</div>
    </div>
    <div class="vehicle-card" onclick="selectVehicle('auto',this)">
      <span class="emoji">🛺</span>
      <div class="name">ऑटो</div>
      <div class="price" id="price-auto">₹0</div>
      <div class="eta">5 मिनट</div>
    </div>
    <div class="vehicle-card" onclick="selectVehicle('bike',this)">
      <span class="emoji">🛵</span>
      <div class="name">बाइक</div>
      <div class="price" id="price-bike">₹0</div>
      <div class="eta">2 मिनट</div>
    </div>
    <div class="vehicle-card" onclick="selectVehicle('car',this)">
      <span class="emoji">🚗</span>
      <div class="name">कैब/कार</div>
      <div class="price" id="price-car">₹0</div>
      <div class="eta">8 मिनट</div>
    </div>
  </div>

  <!-- PASSENGERS & PHONE -->
  <div class="details-row">
    <div class="field" style="max-width:120px">
      <label>सवारी</label>
      <input id="passengers" type="number" min="1" max="6" value="1" onchange="updateAllVehicleFares()">
    </div>
    <div class="field">
      <label>मोबाइल नंबर</label>
      <input id="mobile" type="tel" maxlength="10" placeholder="10 अंकों का नंबर">
    </div>
  </div>

  <div id="routeStatus" style="font-size:13px;font-weight:600;color:var(--primary-dark);margin-bottom:12px;"></div>

  <!-- MAIN CTA BUTTON -->
  <button class="btn-book" onclick="bookRide()">
    <span>🚕</span> <span id="btnLabel">सवारी सेतु बुक करें</span>
  </button>
</div>

<!-- DRIVER PANEL OVERLAY -->
<div id="driverPage" class="overlay-page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2>🛺 ड्राइवर डैशबोर्ड</h2>
    <button id="driverOnlineBtn" style="padding:8px 16px;border-radius:12px;border:0;font-weight:800;background:#DC2626;color:#fff;" onclick="toggleDriverOnline()">🔴 Offline</button>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <span>नई राइड</span>
      <b id="driverNewCount">0</b>
    </div>
    <div class="stat-card">
      <span>आज की कमाई</span>
      <b id="driverEarnings">₹0</b>
    </div>
  </div>

  <div id="driverRequests">
    <div style="background:#fff;padding:16px;border-radius:16px;text-align:center;color:var(--gray);font-weight:600;">
      ऑनलाइन होने पर नई राइड की रिक्वेस्ट यहाँ दिखाई देंगी।
    </div>
  </div>
</div>

<!-- ADMIN PANEL OVERLAY -->
<div id="adminPage" class="overlay-page">
  <h2 style="margin-bottom:16px;">⚙️ एडमिन कंट्रोल</h2>
  <div class="stat-grid">
    <div class="stat-card">
      <span>कुल राइड्स</span>
      <b id="adminBookings">0</b>
    </div>
    <div class="stat-card">
      <span>कुल राजस्व</span>
      <b id="adminRevenue">₹0</b>
    </div>
  </div>
  <div id="adminList" style="margin-top:16px;"></div>
</div>

<!-- BOTTOM NAVIGATION BAR -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('customer',this)">
    <span class="icon">🚕</span>
    <span>सवारी</span>
  </button>
  <button class="nav-item" onclick="switchTab('driver',this)">
    <span class="icon">🛺</span>
    <span>ड्राइवर</span>
  </button>
  <button class="nav-item" onclick="switchTab('admin',this)">
    <span class="icon">📊</span>
    <span>एडमिन</span>
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script>
const GOOGLE_MAPS_API_KEY = "AIzaSyCYbMUnUNe4EFVGIgvz2QJw9YYipIw0rzU";
const firebaseConfig = {apiKey:"AIzaSyDT89G4QK_cmppJK5S3xu70AVbz7V7AqXs",authDomain:"sawari-setu.firebaseapp.com",projectId:"sawari-setu",storageBucket:"sawari-setu.firebasestorage.app",messagingSenderId:"292605368862",appId:"1:292605368862:web:b9945354dfd21f7eb62c0f",measurementId:"G-567NSGD4R4"};

let db=null, bookingsRef=null;
try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  bookingsRef=db.collection("bookings");
}catch(e){console.warn(e);}

let currentRideType = 'Share';
let selectedVehicleType = 'e-rickshaw';
let currentDistanceKm = 0;
let map=null, googleReady=false;
let directionsService=null, directionsRenderer=null, autoService=null, placesService=null;

let pickupLocation = {lat: 25.2672, lng: 82.0725}; // सिरसा
let destLocation = null;
let allBookings = [];
let isDriverOnline = false;

function switchTab(tab, btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('customerSheet').style.display = (tab==='customer')?'block':'none';
  document.getElementById('driverPage').classList.toggle('active', tab==='driver');
  document.getElementById('adminPage').classList.toggle('active', tab==='admin');

  if(tab==='customer' && map && window.google){
    setTimeout(()=>google.maps.event.trigger(map,'resize'), 150);
  }
}

function setRideType(type){
  currentRideType = type;
  document.getElementById('pillShare').classList.toggle('active', type==='Share');
  document.getElementById('pillDirect').classList.toggle('active', type==='Direct');
  updateAllVehicleFares();
}

function selectVehicle(type, card){
  selectedVehicleType = type;
  document.querySelectorAll('.vehicle-card').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  updateButtonLabel();
}

function calculateFare(vehicle, type, distance, passengers){
  const d=parseFloat(distance), p=Math.max(1,parseInt(passengers)||1);
  if(!isFinite(d)||d<=0) return {ok:false, fare:0};
  let fare=0;
  if(vehicle==='e-rickshaw'){
    if(type==='Share'){
      if(d<=2)fare=10;else if(d<=4)fare=20;else if(d<=6)fare=30;else if(d<=8)fare=40;else if(d<=10)fare=50;
      else return {ok:false, fare:0, msg:'10 किमी से अधिक'};
    }else{
      if(d<=2)fare=40;else if(d<=4)fare=60;else if(d<=6)fare=75;else if(d<=8)fare=90;else if(d<=10)fare=105;
      else fare=105+(d-10)*10;
    }
  }else if(vehicle==='auto'){
    if(type==='Share'){fare=d*10*p;}
    else{
      if(d<=5)fare=200;else if(d<=10)fare=325;else if(d<=20)fare=525;else if(d<=30)fare=675;else if(d<=40)fare=775;else if(d<=50)fare=825;
      else fare=825+(d-50)*5;
    }
  }else if(vehicle==='bike'){
    if(type==='Share') return {ok:false, fare:0, msg:'शेयर नहीं'};
    if(d<=2)fare=30;else if(d<=5)fare=50;else if(d<=10)fare=90;else if(d<=15)fare=140;else if(d<=20)fare=190;else if(d<=25)fare=280;else if(d<=30)fare=370;else if(d<=40)fare=480;else if(d<=50)fare=600;
    else fare=600+(d-50)*12;
  }else if(vehicle==='car'){
    if(type==='Share') return {ok:false, fare:0, msg:'शेयर नहीं'};
    if(d<=5)fare=200;else if(d<=10)fare=400;else if(d<=20)fare=800;else if(d<=30)fare=1200;else if(d<=40)fare=1500;else if(d<=50)fare=1800;else if(d<=60)fare=2100;else if(d<=70)fare=2400;else if(d<=80)fare=2700;else if(d<=100)fare=3200;
    else fare=3200+(d-100)*30;
  }
  return {ok:true, fare:Math.round(fare)};
}

function updateAllVehicleFares(){
  const p = document.getElementById('passengers').value;
  ['e-rickshaw','auto','bike','car'].forEach(v=>{
    const res = calculateFare(v, currentRideType, currentDistanceKm, p);
    const el = document.getElementById('price-'+v);
    if(el) el.textContent = res.ok ? '₹'+res.fare : (res.msg||'N/A');
  });
  updateButtonLabel();
}

function updateButtonLabel(){
  const p = document.getElementById('passengers').value;
  const res = calculateFare(selectedVehicleType, currentRideType, currentDistanceKm, p);
  const label = document.getElementById('btnLabel');
  if(res.ok){
    label.textContent = `राइड बुक करें — ₹${res.fare}`;
  } else {
    label.textContent = 'सवारी सेतु बुक करें';
  }
}

/* GOOGLE MAPS LOADER */
function loadGoogleMaps(){
  if(window.google && google.maps){initMap();return;}
  const script=document.createElement('script');
  script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&libraries=places';
  script.async=true;
  script.defer=true;
  script.onload=initMap;
  document.head.appendChild(script);
}

function initMap(){
  if(!window.google || !google.maps) return;
  googleReady = true;

  directionsService = new google.maps.DirectionsService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    suppressMarkers: false,
    polylineOptions: { strokeColor: '#00AA4F', strokeWeight: 6, strokeOpacity: 0.9 }
  });

  map = new google.maps.Map(document.getElementById('map'),{
    center: pickupLocation,
    zoom: 14,
    disableDefaultUI: true,
    zoomControl: false,
    styles: [
      { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }
    ]
  });

  directionsRenderer.setMap(map);
  autoService = new google.maps.places.AutocompleteService();
  placesService = new google.maps.places.PlacesService(map);

  document.getElementById('map').classList.add('loaded');
}

/* OLA-STYLE LIVE AUTOCOMPLETE */
let searchTimer = null;
function onSearchInput(field){
  clearTimeout(searchTimer);
  const val = document.getElementById(field).value.trim();
  if(val.length < 2){
    clearSuggestions(field);
    return;
  }
  searchTimer = setTimeout(()=>fetchPredictions(field, val), 180);
}

function clearSuggestions(field){
  const box = document.getElementById(field==='pickup'?'pickupSuggestions':'destinationSuggestions');
  if(box) box.innerHTML = '';
}

function fetchPredictions(field, query){
  const box = document.getElementById(field==='pickup'?'pickupSuggestions':'destinationSuggestions');
  if(!box || !googleReady || !autoService) return;

  const center = new google.maps.LatLng(pickupLocation.lat, pickupLocation.lng);
  const circle = new google.maps.Circle({ center: center, radius: 75000 });

  autoService.getPlacePredictions({
    input: query,
    bounds: circle.getBounds(),
    origin: center,
    componentRestrictions: { country: 'in' }
  }, (predictions, status)=>{
    if(status === google.maps.places.PlacesServiceStatus.OK && predictions && predictions.length > 0){
      box.innerHTML = '';
      predictions.slice(0, 6).forEach(p => {
        const item = document.createElement('div');
        item.className = 'sugg-item';
        
        let dist = '';
        if(p.distance_meters) dist = ` (${(p.distance_meters/1000).toFixed(1)} km)`;

        item.innerHTML = `
          <span style="font-size:16px;">📍</span>
          <div>
            <b>${escapeHtml(p.structured_formatting.main_text)} <span style="color:var(--primary);">${dist}</span></b>
            <small>${escapeHtml(p.description)}</small>
          </div>
        `;

        item.onclick = () => {
          document.getElementById(field).value = p.structured_formatting.main_text;
          clearSuggestions(field);

          placesService.getDetails({ placeId: p.place_id, fields: ['geometry'] }, (place, stat)=>{
            if(stat === 'OK' && place && place.geometry){
              const loc = { lat: place.geometry.location.lat(), lng: place.geometry.location.lng() };
              if(field==='pickup') pickupLocation = loc;
              else destLocation = loc;

              drawDrivingRoute();
            }
          });
        };
        box.appendChild(item);
      });
    } else {
      box.innerHTML = '<div style="padding:12px;font-size:13px;color:var(--gray);">कोई स्थान नहीं मिला।</div>';
    }
  });
}

/* DRAW ROUTE */
function drawDrivingRoute(){
  if(!googleReady || !directionsService || !directionsRenderer || !pickupLocation || !destLocation) return;
  document.getElementById('routeStatus').textContent = '🚗 सड़क का रूट लोड हो रहा है...';

  directionsService.route({
    origin: new google.maps.LatLng(pickupLocation.lat, pickupLocation.lng),
    destination: new google.maps.LatLng(destLocation.lat, destLocation.lng),
    travelMode: google.maps.TravelMode.DRIVING
  }, (res, status)=>{
    if(status === 'OK'){
      directionsRenderer.setDirections(res);
      const leg = res.routes[0].legs[0];
      currentDistanceKm = (leg.distance.value / 1000);
      document.getElementById('routeStatus').innerHTML = `📏 दूरी: <b>${currentDistanceKm.toFixed(2)} km</b> (${leg.duration.text})`;
      updateAllVehicleFares();
    } else {
      document.getElementById('routeStatus').textContent = '⚠️ सड़क मार्ग नहीं मिला।';
    }
  });
}

function useCurrentLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      pickupLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.setCenter(pickupLocation);
      map.setZoom(15);
      
      const geocoder = new google.maps.Geocoder();
      geocoder.geocode({ location: pickupLocation }, (res, stat)=>{
        if(stat==='OK' && res[0]){
          document.getElementById('pickup').value = res[0].formatted_address.split(',')[0] + ', प्रयागराज';
        }
      });
      if(destLocation) drawDrivingRoute();
    });
  }
}

/* BOOKING & FIREBASE */
function bookRide(){
  const mobile = document.getElementById('mobile').value.trim();
  if(!/^\d{10}$/.test(mobile)){
    alert('कृपया 10 अंकों का मान्य मोबाइल नंबर डालें।');
    return;
  }
  const p = document.getElementById('passengers').value;
  const fareRes = calculateFare(selectedVehicleType, currentRideType, currentDistanceKm, p);
  if(!fareRes.ok){
    alert('कृपया पहले गंतव्य स्थान चुनकर रूट बनने दें।');
    return;
  }

  const booking = {
    pickup: document.getElementById('pickup').value,
    destination: document.getElementById('destination').value,
    distanceKm: currentDistanceKm.toFixed(2),
    vehicle: selectedVehicleType,
    rideType: currentRideType,
    passengers: parseInt(p)||1,
    mobile: mobile,
    fare: fareRes.fare,
    status: 'new',
    createdAt: new Date().toISOString()
  };

  allBookings.unshift(booking);
  if(bookingsRef) bookingsRef.add(booking).catch(e=>console.warn(e));
  alert(`✅ सवारी सेतु राइड बुक हो गई!\nकिराया: ₹${fareRes.fare}\nड्राइवर जल्द संपर्क करेगा।`);
}

function toggleDriverOnline(){
  isDriverOnline = !isDriverOnline;
  const btn = document.getElementById('driverOnlineBtn');
  btn.textContent = isDriverOnline ? '🟢 Online' : '🔴 Offline';
  btn.style.background = isDriverOnline ? '#00AA4F' : '#DC2626';
  renderDriverPanel();
}

function renderDriverPanel(){
  const container = document.getElementById('driverRequests');
  const pending = allBookings.filter(b=>b.status==='new');
  document.getElementById('driverNewCount').textContent = pending.length;

  if(!isDriverOnline){
    container.innerHTML = '<div style="background:#fff;padding:16px;border-radius:16px;text-align:center;color:var(--gray);font-weight:600;">ऑनलाइन होने पर नई राइड की रिक्वेस्ट यहाँ दिखाई देंगी।</div>';
    return;
  }
  if(pending.length===0){
    container.innerHTML = '<div style="background:#fff;padding:16px;border-radius:16px;text-align:center;color:var(--primary);font-weight:700;">🟢 आप ऑनलाइन हैं। नई सवारी की प्रतीक्षा है...</div>';
    return;
  }

  container.innerHTML = pending.map((b,i)=>`
    <div style="background:#fff;padding:14px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <b>${escapeHtml(b.pickup)} → ${escapeHtml(b.destination)}</b>
        <span style="color:var(--primary);font-weight:800;">₹${b.fare}</span>
      </div>
      <div style="font-size:12px;color:var(--gray);margin-bottom:10px;">
        📏 ${b.distanceKm} km • 🚕 ${b.vehicle} • 📱 ${b.mobile}
      </div>
      <button style="width:100%;padding:10px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:800;cursor:pointer;" onclick="acceptRide(${i})">
        सवारी स्वीकार करें
      </button>
    </div>
  `).join('');
}

function acceptRide(index){
  allBookings[index].status = 'accepted';
  alert('राइड स्वीकार कर ली गई!');
  renderDriverPanel();
}

function escapeHtml(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

window.addEventListener('load', ()=>{
  loadGoogleMaps();
  updateAllVehicleFares();
});
</script>
</body>

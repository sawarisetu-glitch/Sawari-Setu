<script>
/* ========================================================
   RELIABLE MAP & GPS ENGINE (LEAFLET WITH NOMINATIM FALLBACK)
======================================================== */
function initMapEngine() {
  const container = document.getElementById("map");
  if (!container || leafletMap) return;

  leafletMap = L.map("map", {
    zoomControl: true,
    attributionControl: false
  }).setView([currentPickupCoords.lat, currentPickupCoords.lng], 14);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
  }).addTo(leafletMap);

  pickupMarker = L.marker([currentPickupCoords.lat, currentPickupCoords.lng], {
    title: "पिकअप स्थान"
  }).addTo(leafletMap);
}

function fetchGPS() {
  const st = document.getElementById("gpsStatus");
  st.className = "status";
  st.textContent = "📍 वर्तमान GPS लोकेशन प्राप्त की जा रही है...";

  if (!navigator.geolocation) {
    st.className = "status error";
    st.textContent = "डिवाइस में GPS उपलब्ध नहीं है। Permission चेक करें।";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      currentPickupCoords = { lat, lng };
      st.className = "status success";
      st.textContent = "✅ लोकेशन प्राप्त हुई (±" + Math.round(pos.coords.accuracy) + " मीटर)";

      if (leafletMap) {
        leafletMap.setView([lat, lng], 16);
        if (pickupMarker) pickupMarker.setLatLng([lat, lng]);
        else pickupMarker = L.marker([lat, lng]).addTo(leafletMap);
      }

      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=hi`)
        .then(r => r.json())
        .then(data => {
          if (data && data.display_name) {
            document.getElementById("pPickup").value = data.display_name.split(",").slice(0, 3).join(",");
          }
        }).catch(()=>{});

      if (currentDestCoords) drawRouteOSRM();
    },
    err => {
      st.className = "status error";
      if (err.code === 1) st.textContent = "GPS अनुमति अस्वीकार की गई। कृपया Location अनुमति ON करें।";
      else if (err.code === 2) st.textContent = "GPS सिग्नल नहीं मिला। फोन की Location सेवा ON करें।";
      else st.textContent = "लोकेशन टाइमआउट। खुले स्थान में पुनः प्रयास करें।";
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
}
